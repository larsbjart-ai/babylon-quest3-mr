<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Babylon Quest 3 MR</title>

    <!-- Babylon.js core + loaders -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

async function createScene() {
    const scene = new BABYLON.Scene(engine);

    // Basic light
    new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

    // Load your model
    BABYLON.SceneLoader.Append("", "roof.glb", scene, function () {
        const root = scene.meshes[scene.meshes.length - 1];
        root.position = new BABYLON.Vector3(0, 1, 0);
        root.scaling = new BABYLON.Vector3(1, 1, 1);
    });

    // Enable WebXR AR mode
    const xr = await scene.createDefaultXRExperienceAsync({
        uiOptions: { sessionMode: "immersive-ar" },
        optionalFeatures: true
    });

    // Enable passthrough
    xr.baseExperience.featuresManager.enableFeature(
        BABYLON.WebXRFeatureName.PASSTHROUGH
    );

    return scene;
}

// Start engine + render loop
createScene().then(scene => {
    engine.runRenderLoop(() => scene.render());
});
</script>

</body>
</html>
